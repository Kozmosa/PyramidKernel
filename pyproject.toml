[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyramidkernel"
version = "0.1.0"
description = "A stage-structured multi-agent framework for LLM-driven GPU kernel optimization."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Husk Xu" },
  { name = "Yijia Duan" },
  { name = "Qianli Ma" },
  { name = "Zhipeng Zhang" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["GPU kernels", "CUDA", "KernelBench", "large language models", "multi-agent systems"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
]
cuda = [
  "torch>=2.4",
]
triton = [
  "triton>=3.0",
]
tilelang = [
  "tilelang>=0.1",
]
local-model = [
  "torch>=2.4",
  "transformers>=4.45",
  "accelerate>=1.0",
]
cute = [
  "nvidia-cutlass-dsl",
]

[project.scripts]
pyramidkernel = "pyramidkernel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyramidkernel", "pyramidkernel.*"]

[tool.setuptools.data-files]
"share/pyramidkernel/configs/deliberation" = ["configs/deliberation/*.yaml"]
"share/pyramidkernel/configs/evaluation/evaluators" = ["configs/evaluation/evaluators/*.yaml"]
"share/pyramidkernel/configs/evaluation/measurement" = ["configs/evaluation/measurement/*.yaml"]
"share/pyramidkernel/configs/experiments" = ["configs/experiments/*.yaml"]
"share/pyramidkernel/configs/models/providers" = ["configs/models/providers/*.yaml"]
"share/pyramidkernel/configs/models/routes" = ["configs/models/routes/*.yaml"]
"share/pyramidkernel/configs/runtime" = ["configs/runtime/*.yaml"]
"share/pyramidkernel/configs/search" = ["configs/search/*.yaml"]
"share/pyramidkernel/configs/tasks" = ["configs/tasks/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
