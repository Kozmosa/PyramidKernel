[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyramidkernel"
version = "0.1.0"
description = "Public implementation of PyramidKernel for LLM-driven GPU kernel optimization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
cuda = [
  "torch>=2.4",
]
triton = [
  "triton>=3.0",
]
tilelang = [
  "tilelang>=0.1",
]

[project.scripts]
stark = "stark.cli:main"
pyramidkernel = "pyramidkernel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyramidkernel", "pyramidkernel.*", "stark", "stark.*", "src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Keep CI focused on correctness-oriented lint until the historical codebase
# can be reformatted without obscuring the public-release review.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
